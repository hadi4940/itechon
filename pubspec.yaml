name: itechone
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  responsive_grid: ^2.4.4
  flutter_staggered_grid_view: ^0.7.0
  firebase_core: ^2.25.3
  firebase_auth: ^4.17.3
  fluttertoast: ^8.2.1
  loading_animation_widget: ^1.2.0+4
  cloud_firestore: ^4.15.3
  video_player: ^2.8.2
  card_swiper: ^3.0.1
  image_picker_web: ^3.1.1
  uuid: ^4.2.2
  firebase_storage: ^11.2.4
  image_downloader_web: ^2.0.2
  email_sender: ^1.3.3
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo/
    - assets/videos/


